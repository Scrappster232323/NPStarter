name: Build Linux Binary

on: [push] # Startet den Build jedes Mal, wenn du Code hochlädst

jobs:
  build:
    runs-on: ubuntu-latest # Hier läuft ein echter Linux-Server für dich!

    steps:
    - name: Code auschecken
      uses: actions/checkout@v4

    - name: Python einrichten
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: PyInstaller installieren
      run: |
        python -m pip install --upgrade pip
        pip install pyinstaller
        # Falls dein Skript extra Bibliotheken braucht, installiere sie hier, z.B.:
        # pip install requests

    - name: Binary kompilieren
      run: pyinstaller --onefile mein_skript.py # Passe hier den Namen deines Skripts an

    - name: Datei hochladen
      uses: actions/upload-artifact@v4
      with:
        name: linux-executable
        path: dist/
